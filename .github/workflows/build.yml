name: Build Creator Surge Project & Artifacts

on:
  push:
    branches: [ "main", "master", "creator-surge-super-agent*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Package Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Ktor Backend
        run: ./gradlew :backend:build --no-daemon

      - name: Build Android Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build Android Debug AAB (Android App Bundle)
        run: ./gradlew :app:bundleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: creator-surge-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Debug AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: creator-surge-app-debug-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error

      - name: Upload Ktor Backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: creator-surge-backend-jar
          path: backend/build/libs/backend-1.0.0.jar
          if-no-files-found: ignore
